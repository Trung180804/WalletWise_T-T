name: Mobile CI

on:
  push:
    branches:
      - main
      - kmp-ios-migration
  pull_request:
    branches:
      - main
      - kmp-ios-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Android Build & Tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Shared Host Tests
        run: ./gradlew :shared:testAndroidHostTest --rerun-tasks

      - name: Compile Android Main
        run: ./gradlew :shared:compileAndroidMain

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug -PuseFirebaseEmulator=true

      - name: Lint Debug
        run: ./gradlew :app:lintDebug

  windows-wrapper-smoke:
    name: Windows Gradle Wrapper Smoke Test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Empty CLASSPATH Handling
        shell: powershell
        run: |
          Remove-Item Env:CLASSPATH -ErrorAction SilentlyContinue
          Write-Output "Env:CLASSPATH exists: $(Test-Path Env:CLASSPATH)"
          .\gradlew.bat --version
          .\gradlew.bat :shared:compileKotlinMetadata
